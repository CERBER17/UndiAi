<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Popup QR Code</title>
    <style>
        /* Gaya untuk tombol Scan QR */
        .btn-scan {
            background-color: #4CAF50;
            color: white;
            padding: 15px 32px;
            text-align: center;
            font-size: 16px;
            margin: 20px;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            transition: background-color 0.3s;
        }

        .btn-scan:hover {
            background-color: #45a049;
        }

        /* Gaya untuk latar belakang Modal (Popup) */
        .modal {
            display: none; /* Sembunyikan modal secara default */
            position: fixed;
            z-index: 1;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5); /* Latar belakang gelap transparan */
        }

        /* Gaya untuk konten di dalam Popup */
        .modal-content {
            background-color: #f9f9f9;
            margin: 10% auto; /* Jarak dari atas dan posisikan di tengah */
            padding: 20px;
            border: 1px solid #888;
            width: 90%;
            max-width: 350px;
            text-align: center;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        /* Gaya untuk gambar QR Code */
        .qr-image {
            width: 100%;
            max-width: 250px;
            margin-top: 15px;
        }

        /* Gaya untuk tombol Close (X) */
        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }

        .close:hover,
        .close:focus {
            color: black;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <!-- Tombol untuk memunculkan Popup -->
    <div style="text-align: center;">
        <button id="scanBtn" class="btn-scan">Scan QR</button>
    </div>

    <!-- Elemen Modal (Popup) -->
    <div id="qrModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Lokasi Koordinat</h2>
            <p>Silakan scan QR Code di bawah ini:</p>
            <!-- Gambar QR Code dari link QuickChart sebelumnya -->
            <img src="https://quickchart.io/qr?text=https%3A%2F%2Fmaps.google.com%2F%3Fq%3D-6.661583%2C108.488278&size=300" alt="QR Code" class="qr-image">
        </div>
    </div>

    <!-- Skrip Javascript untuk mengatur Popup -->
    <script>
        // Mengambil elemen-elemen HTML
        var modal = document.getElementById("qrModal");
        var btn = document.getElementById("scanBtn");
        var span = document.getElementsByClassName("close")[0];

        // Ketika pengguna mengklik tombol, tampilkan modal
        btn.onclick = function() {
            modal.style.display = "block";
        }

        // Ketika pengguna mengklik tanda 'X', sembunyikan modal
        span.onclick = function() {
            modal.style.display = "none";
        }

        // Ketika pengguna mengklik area di luar popup, sembunyikan modal
        window.onclick = function(event) {
            if (event.target == modal) {
                modal.style.display = "none";
            }
        }
    </script>

</body>
</html>
